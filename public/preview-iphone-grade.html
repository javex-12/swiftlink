  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            serif: ['"Playfair Display"', 'serif'],
            display: ['"Cabinet Grotesk"', 'sans-serif'],
          },
          colors: {
            obsidian: '#070709',
            champagne: '#e5c07b',

      }
    }

  <style>
    /* Smooth Apple-like physics */
    * {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .glass-dock {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
    }
    .dark .glass-dock {
      background: rgba(18, 18, 22, 0.75);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .dark .glass-card {
      background: rgba(25, 25, 30, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    /* Dynamic Island expansion */

      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .dynamic-island:hover {
      width: 220px;
      height: 34px;
      border-radius: 20px;
    }

    function renderScreen() {
      const container = document.getElementById('storefront-body');
      container.innerHTML = templates[currentTemplate].render();
      lucide.createIcons();
    }

    function setTemplate(name) {
      currentTemplate = name;
      ['bloom', 'noir', 'coast', 'market'].forEach(t => {
        const btn = document.getElementById('btn-' + t);
        if (t === name) {
          btn.className = "px-3 py-1.5 rounded-xl font-bold transition bg-emerald-500 text-zinc-950 shadow-sm";
        } else {
          btn.className = "px-3 py-1.5 rounded-xl font-bold transition text-zinc-400 hover:text-white";
        }
      });
      renderScreen();
    }

    function toggleTheme() {
      isDarkMode = !isDarkMode;
      const screen = document.getElementById('screen-container');
      const themeIcon = document.getElementById('theme-icon');
      const themeLabel = document.getElementById('theme-label');

      if (isDarkMode) {
        screen.classList.add('dark');
        screen.classList.remove('bg-white', 'text-zinc-900');
        screen.classList.add('bg-zinc-950', 'text-zinc-100');
        themeIcon.setAttribute('data-lucide', 'moon');
        themeIcon.classList.remove('text-amber-400');
        themeIcon.classList.add('text-blue-400');
        themeLabel.innerText = "Dark Mode";
      } else {
        screen.classList.remove('dark');
        screen.classList.remove('bg-zinc-950', 'text-zinc-100');
        screen.classList.add('bg-white', 'text-zinc-900');
        themeIcon.setAttribute('data-lucide', 'sun');
        themeIcon.classList.remove('text-blue-400');
        themeIcon.classList.add('text-amber-400');
        themeLabel.innerText = "Light Mode";
      }
      lucide.createIcons();
    }

    function toggleChassis() {
      isChassisOpen = !isChassisOpen;
      const chassis = document.getElementById('phone-chassis');
      const btn = document.getElementById('btn-chassis-toggle');
      if (isChassisOpen) {
        chassis.className = "relative w-full max-w-[400px] h-[844px] rounded-[52px] p-[10px] bg-gradient-to-b from-[#2a2b2f] via-[#1a1b1e] to-[#25262a] shadow-[0_25px_70px_rgba(0,0,0,0.85),0_0_0_1px_rgba(255,255,255,0.1),inset_0_0_0_2px_rgba(0,0,0,0.9)] transition-all duration-500 flex flex-col";
        btn.querySelector('span').innerText = "Frame";
      } else {
        chassis.className = "relative w-full max-w-lg h-[844px] rounded-3xl p-0 shadow-2xl transition-all duration-500 flex flex-col border border-zinc-800";
        btn.querySelector('span').innerText = "Full";
      }
    }

    function addToCart() {
      cartCount++;
      document.getElementById('cart-dock-badge').innerText = cartCount;
      const dock = document.getElementById('bottom-dock');
      dock.classList.add('scale-105');
      setTimeout(() => dock.classList.remove('scale-105'), 200);
    }

    function navClick(type) {
      if (type === 'whatsapp') {
        alert("VIP WhatsApp concierge inquiry ready for: " + templates[currentTemplate].phone);
      } else {
        alert("Opened " + type.toUpperCase() + " screen");
      }
    }

    // Initialize
    window.addEventListener('DOMContentLoaded', () => {
      renderScreen();
      lucide.createIcons();
    });
