SH.del=['Delete account','Deleted accounts enter a 30-day grace period before data is permanently wiped.','<button class="btn dfill" style="width:100%;margin-top:18px" data-a="toast" data-m="Disabled in this prototype">Delete account (30 days)</button><p class="help" style="margin-top:10px;text-align:center">Changed your mind? Tap Done to keep everything.</p>'];
function lrow(i,t,s,a,v){return '<button class="li" data-a="'+a+'" data-v="'+v+'" data-m="'+v+'"><span class="ic">'+ic(i)+'</span><div><b>'+t+'</b><small>'+s+'</small></div>'+ic('chev')+'</button>'}
function settings(){
 var pl=PL[S.plan],used=Math.min(2,pl[4]),top=S.plan==2,nx=PL[S.plan+1];
 var h='<div class="head"><div><h1>Settings</h1><p class="sub">Your account, plan and store options.</p></div><span class="tag ok" style="margin-top:8px">'+pl[0]+'</span></div>';
 h+='<section class="hero" style="margin-top:18px"><div class="rowb" style="justify-content:flex-start;gap:16px"><button class="blob" style="width:84px;height:84px;flex:none;background:var(--p);color:var(--onp)" data-a="sheet" data-v="me" aria-label="Edit profile">'+ic('user','width:36px;height:36px')+'</button><div><div class="hi">Signed in as</div><h1 style="font-size:30px;margin:0">Michael</h1><small>PoloG</small></div></div><div class="pst"><div><b>'+S.prods.length+'</b><small>Active products</small></div><div><b>'+(S.cats.length-1)+'</b><small>Categories</small></div><div><b>'+(S.live?'Live':'Paused')+'</b><small>Public status</small></div></div></section>';
 h+='<h2>Plan and usage</h2><section class="card"><div class="rowb"><div><small class="help">Your plan</small><div style="font-size:30px;font-weight:800;line-height:1.1">'+pl[0]+'</div></div><b>'+pl[1]+(S.plan?' / month':'')+'</b></div>';
 h+=[['Products',S.prods.length,pl[3]],['Stores',used,pl[4]]].map(function(u){return '<div style="margin-top:14px"><div class="rowb"><span>'+u[0]+'</span><b>'+u[1]+' of '+u[2]+'</b></div><div class="tr" style="margin-top:6px"><i style="width:'+Math.max(3,u[1]/u[2]*100)+'%"></i></div></div>'}).join('');
 h+='<div class="plans">'+PL.map(function(p,i){return '<div class="plan'+(i==S.plan?' cur':'')+'"><div class="rowb"><h4>'+p[0]+'</h4>'+(i==S.plan?'<span class="tag ok">Current</span>':(i==1?'<span class="tag">Most popular</span>':''))+'</div><b>'+p[1]+(i?' / month':'')+'</b><ul>'+p[2].map(function(f){return '<li>'+ic('ck','width:16px;height:16px;stroke-width:3')+f+'</li>'}).join('')+'</ul></div>'}).join('')+'</div>';
 h+=top?'<div class="pulse" style="margin-top:16px">'+ic('ck')+'<div><b>Business is the highest plan</b><p>Every feature is included. Nothing to upgrade.</p></div></div>':'<button class="btn filled" style="width:100%;margin-top:16px" data-a="toast" data-m="Opens payment for '+nx[0]+'">Upgrade to '+nx[0]+' · '+nx[1]+' / month</button>';
 h+='<button class="btn tonal" style="width:100%;margin-top:10px" data-a="toast" data-m="Opens WhatsApp support">'+ic('chat')+'Ask about your plan</button><p class="help" style="margin-top:14px">Plan changes apply as soon as payment is confirmed. Nothing is deleted at a limit: extra products are hidden and extra stores are paused until you upgrade.</p></section>';
 h+='<h2>Store</h2><div class="list"><div class="li'+(S.live?'':' paused')+'"><span class="ic">'+ic('eye')+'</span><div><b>Store visibility</b><small>'+(S.live?'Live. Buyers can send orders':'Paused. Buyers can’t order')+'</small></div><button class="sw" data-a="live" aria-label="Pause or resume store"></button></div>'+(S.plan==2?lrow('globe','Your own domain','Not connected yet','sheet','dom'):lrow('globe','Your own domain','Included in Business','toast','Custom domains are on the Business plan'))+lrow('store','Store details','PoloG · /polog','sheet','prof')+'</div>';
 h+='<h2>Account</h2><div class="list">'+lrow('user','Your profile','Name, email and photo','sheet','me')+lrow('down','Install SwiftLink Pro','Add it to your home screen','toast','Opens the install prompt')+lrow('out','Sign out','','toast','Signed out (prototype)')+'</div>';
 h+='<h2>Danger zone</h2><section class="card"><p class="help">Deleted accounts enter a 30-day grace period before data is permanently wiped.</p><button class="btn danger" style="width:100%;margin-top:14px" data-a="sheet" data-v="del">Delete account</button></section>';
 h+='<p class="help" style="text-align:center;margin-top:26px">Prototype only: preview as</p><div class="scroll" style="justify-content:center;margin-top:8px">'+PL.map(function(p,i){return '<button class="fchip'+(S.plan==i?' on':'')+'" data-a="plan" data-v="'+i+'">'+p[0]+'</button>'}).join('')+'</div>';
 return h;
}

/* ---------- Nav + render ---------- */
var N=[['home','home','Home'],['inq','chat','Inquiries'],['store','store','Store'],['stats','stats','Stats'],['set','gear','Settings']];
function nav(){$('nav').innerHTML=N.map(function(n){return '<button class="'+(S.page==n[0]?'on':'')+'" data-a="nav" data-v="'+n[0]+'"><i>'+ic(n[1])+'</i>'+n[2]+'</button>'}).join('')}
function render(){$('main').innerHTML=({home:home,inq:inq,store:store,stats:stats,set:settings})[S.page]();nav();var w=$('wa');if(w)setTimeout(function(){w.style.strokeDashoffset=100-20*S.n},60);var pl=document.querySelector('.plans');if(pl)pl.scrollLeft=S.plan*pl.scrollWidth/3}
document.addEventListener('click',function(e){
 var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a,v=b.dataset.v;
 if(a=='nav'){S.page=v;render();window.scrollTo(0,0)}
 else if(a=='f'){S.f=v;render()}
 else if(a=='sample'){S.sample=!S.sample;S.items=SAMPLE();render()}
 else if(a=='confirm'){S.items[v].ok=1;render();toast('Sale confirmed')}
 else if(a=='copylink'){copy('https://'+URL_,'Link copied')}
 else if(a=='tab'){S.tab=v;render()}
 else if(a=='live'){S.live=!S.live;render();toast(S.live?'Store is live again':'Store paused. Buyers can’t order')}
 else if(a=='stock'){S.prods=[['Stock idea 1','₦0'],['Stock idea 2','₦0'],['Stock idea 3','₦0'],['Stock idea 4','₦0']];render();toast('4 stock ideas added')}
 else if(a=='addcat'){var i=$('cin'),x=i.value.trim();if(x){S.cats.push(x);render();toast('Category added')}}
 else if(a=='tpl'){S.tpl=+v;S.tc=1;render()}
 else if(a=='sheet'){open(v)}
 else if(a=='close'){close()}
 else if(a=='var'){var t=$('wt');t.value+=(t.value&&!/\s$/.test(t.value)?' ':'')+v;wp()}
 else if(a=='reset'){$('wt').value=DEF;wp()}
 else if(a=='pv'){S.pv.open=1;S.pv.t=S.tpl;pv()}
 else if(a=='pvclose'){S.pv.open=0;pv()}
 else if(a=='pvt'){S.pv.t=+v;pv()}
 else if(a=='pvd'){S.pv.dark=+v;pv()}
 else if(a=='pvuse'){S.tpl=S.pv.t;S.tc=1;S.pv.open=0;pv();render();toast(TN[S.tpl]+' template applied')}
 else if(a=='gostore'){S.page='store';S.tab='products';render();window.scrollTo(0,0)}
 else if(a=='gocodes'){S.page='store';render();open('disc')}
 else if(a=='copych'){S.ch=v;render();copy('https://'+URL_+'?ref='+v.toLowerCase(),v+' link copied')}
 else if(a=='share'){if(navigator.share){navigator.share({url:'https://'+URL_}).catch(function(){})}else{copy('https://'+URL_,'Link copied')}}
 else if(a=='plan'){S.plan=+v;render()}
 else if(a=='toast'){toast(b.dataset.m)}
});
render();
})();
</script>
</body>
</html>
